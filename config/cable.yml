# NOTE: the `async` adapter only works within a single process. This app runs
# web (Puma) and jobs (Solid Queue) as separate processes, so Turbo broadcasts
# from a job would never reach the browser under `async`. Use the DB-backed
# solid_cable adapter in development too (single dev DB holds solid_cable_messages).
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
