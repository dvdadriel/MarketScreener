default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: crypto_screener_development

test:
  <<: *default
  database: crypto_screener_test

# Supabase free tier = satu database. Semua koneksi logis (primary/cache/
# queue/cable) diarahkan ke DATABASE_URL yang sama (lihat
# production.rb solid_queue/cache/cable.connects_to — Opsi A di
# docs/idx-screener-deploy-plan.md Fase 1.3).
#
# prepared_statements/advisory_locks: false wajib di belakang pooler Supabase
# (port 6543, transaction mode). Migrasi harus lewat DATABASE_URL direct
# (port 5432) — pooler tidak mendukung DDL dengan advisory lock.
production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    prepared_statements: false
    advisory_locks: false
  cache:
    <<: *primary_production
  queue:
    <<: *primary_production
  cable:
    <<: *primary_production
