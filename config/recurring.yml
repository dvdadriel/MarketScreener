# ── CRYPTO DINONAKTIFKAN (fokus saham IDX) ──────────────────────────────
# Uncomment blok price_poller_* + sentiment_fetcher untuk mengaktifkan lagi.
# PricePollerJob = satu-satunya pemicu data & signal eval crypto; mematikannya
# menghentikan seluruh pipeline crypto di sumber. Set juga CRYPTO_ENABLED=true.
#
# price_poller_5m:
#   class: PricePollerJob
#   schedule: "* * * * *"               # every 1 min
#   args: [{ timeframe: "5m" }]
#   queue: realtime
#
# price_poller_15m:
#   class: PricePollerJob
#   schedule: "*/3 * * * *"             # every 3 min
#   args: [{ timeframe: "15m" }]
#   queue: realtime
#
# price_poller_1h:
#   class: PricePollerJob
#   schedule: "*/10 * * * *"            # every 10 min
#   args: [{ timeframe: "1h" }]
#   queue: realtime
#
# price_poller_4h:
#   class: PricePollerJob
#   schedule: "0 * * * *"               # every hour
#   args: [{ timeframe: "4h" }]
#   queue: realtime
#
# price_poller_1d:
#   class: PricePollerJob
#   schedule: "0 */6 * * *"             # every 6 hours
#   args: [{ timeframe: "1d" }]
#   queue: realtime
# ─────────────────────────────────────────────────────────────────────────

# Semua jadwal IDX di bawah ini pindah ke GitHub Actions
# (.github/workflows/scheduled-jobs.yml, task idx:* di lib/tasks/idx.rake) —
# supaya tidak bergantung pada Puma/Render tetap bangun. Lihat
# docs/idx-screener-deploy-plan.md Fase 2.
#
# stock_poller            → idx:poll                (*/30 * * * *)
# idx_universe_refresh    → idx:universe_refresh     (0 22 * * *)
# idx_scanner             → idx:scanner              (30 9 * * 1-5)
# momentum_snapshot       → idx:snapshot             (0 10 * * 1-5)
# rank_report             → idx:rank_report          (15 10 * * 1-5)
# momentum_weekly_report  → idx:weekly_report         (30 10 * * 5)
# paper_trade_updater     → idx:paper_trade_update   (*/5 * * * *)
# daily_summary           → idx:daily_summary         (0 10 * * *)
# evidence_backup         → idx:evidence_backup       (45 11 * * *)
# candle_prune            → idx:candle_prune          (15 3 * * *)
# failed_job_alert        → idx:failed_job_alert      (*/15 * * * *)
# health_monitor          → idx:health_monitor        (*/5 * * * *)

# telegram_poller TETAP di sini — GitHub Actions tidak menjamin interval
# di bawah 5 menit, jadi bot command Telegram akan terasa lambat/hilang
# kalau dipindah. Ini berarti Puma harus tetap hidup untuk command bot;
# upgrade ke webhook Telegram (lih. Fase 2 plan) menghapus kebutuhan ini.
telegram_poller:
  class: TelegramPollerJob
  schedule: "* * * * *"               # tiap menit — poll perintah bot (no-op tanpa admin chat id)
  queue: realtime
  description: "Poll perintah Telegram (admin-only command bot)"
